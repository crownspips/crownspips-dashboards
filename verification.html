<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crownspips Trading - Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .current-status {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #f3f4f6;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Account Verification</h1>

    <p class="subtitle">
      Complete your information to activate your Crownspips REAL account.
    </p>

    <div id="currentStatus" class="current-status">
      Checking verification status...
    </div>

    <form id="verificationForm">

      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <label for="dateOfBirth">Date of Birth</label>
      <input
        type="date"
        id="dateOfBirth"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="address">Address</label>
      <textarea
        id="address"
        placeholder="Enter your residential address"
        required
      ></textarea>

      <button type="submit" id="submitBtn">
        Submit Verification
      </button>

    </form>

    <div id="message" class="status"></div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://ghagrruxxqtnochooiaj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FORCt30umzxv7ardnSxokA_8l0-En0B";

  let supabaseClient = null;
  let currentUser = null;

  function loadSupabase() {
    return new Promise((resolve, reject) => {

      if (window.supabase) {
        resolve();
        return;
      }

      const script = document.createElement("script");

      script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

      script.onload = resolve;

      script.onerror = () => {
        reject(new Error("Could not load Supabase."));
      };

      document.head.appendChild(script);
    });
  }

  function showMessage(message, type) {
    const box = document.getElementById("message");

    box.textContent = message;
    box.className = "status " + type;
  }

  async function start() {

    try {

      await loadSupabase();

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const {
        data: { session },
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError || !session) {
        window.location.href = "login.html";
        return;
      }

      currentUser = session.user;

      const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

      if (error) {
        throw error;
      }

      document.getElementById("fullName").value =
        profile.full_name || "";

      document.getElementById("dateOfBirth").value =
        profile.date_of_birth || "";

      document.getElementById("phone").value =
        profile.phone || "";

      document.getElementById("address").value =
        profile.address || "";

      const status = profile.verification_status || "pending";

      document.getElementById("currentStatus").textContent =
        "Verification status: " + status.toUpperCase();

      if (status === "verified") {

        document.getElementById("currentStatus").textContent =
          "Your account has been VERIFIED.";

        document.getElementById("verificationForm").style.display = "none";

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to load your account. Please try again.",
        "error"
      );

    }
  }

  document
    .getElementById("verificationForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const button = document.getElementById("submitBtn");

      const fullName =
        document.getElementById("fullName").value.trim();

      const dateOfBirth =
        document.getElementById("dateOfBirth").value;

      const phone =
        document.getElementById("phone").value.trim();

      const address =
        document.getElementById("address").value.trim();

      if (!fullName || !dateOfBirth || !phone || !address) {

        showMessage(
          "Please complete all fields.",
          "error"
        );

        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";

      try {

        const { error } = await supabaseClient
          .from("profiles")
          .update({
            full_name: fullName,
            date_of_birth: dateOfBirth,
            phone: phone,
            address: address,
            verification_status: "pending"
          })
          .eq("id", currentUser.id);

        if (error) {
          throw error;
        }

        document.getElementById("currentStatus").textContent =
          "Verification status: PENDING";

        showMessage(
          "Your verification information has been submitted successfully. Our team will review it.",
          "success"
        );

      } catch (error) {

        console.error(error);

        showMessage(
          "Submission failed. Please try again.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Submit Verification";

      }

    });

  start();
</script>

</body>
  </html>
