<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crownspips Trading - Admin Login</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  width:90%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 4px 20px #0002;
}
h1{text-align:center}
.gold{color:#d4af37}
label{display:block;margin-top:15px}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ddd;
  border-radius:8px;
  box-sizing:border-box;
}
button{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-weight:bold;
}
.demo{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="box">

<h1>Crownspips <span class="gold">Trading</span></h1>
<h2>Admin Login</h2>

<form onsubmit="login(event)">

<label>Admin Email</label>
<input type="email" id="email" required>

<label>Password</label>
<input type="password" id="password" required>

<button type="submit">Admin Login</button>

</form>

<div class="demo">
Demo administrator login only.
</div>

</div>

<script>
function login(event){
  event.preventDefault();

  alert("Demo admin login successful.");

  window.location.href="admin.html";
}
</script>

</body>
</html>
