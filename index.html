<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crownspips Trading Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    #logoutBtn {
      background: #dc2626;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    #loading {
      text-align: center;
      padding: 80px 10px;
      font-size: 24px;
    }

    #error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 30px;
      line-height: 1.5;
    }

    .banner {
      color: white;
      padding: 28px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .demo { background: #2563eb; }
    .real { background: #059669; }
    .pending { background: #d97706; }
    .rejected { background: #dc2626; }

    .banner h3 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .banner p {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
    }

    .info,
    .card,
    section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .info p {
      margin: 8px 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card h4 {
      margin: 0 0 15px;
      color: #64748b;
      font-size: 18px;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
    }

    .usd {
      border-left: 5px solid #2563eb;
    }

    .ngn {
      border-left: 5px solid #059669;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    .buttons button {
      border: 0;
      padding: 15px 22px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .deposit { background: #16a34a; }
    .withdraw { background: #7c3aed; }
    .trade { background: #2563eb; }
    .verify { background: #d97706; }

    .disabled {
      background: #94a3b8 !important;
      cursor: not-allowed !important;
    }

    .item {
      padding: 14px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .muted {
      color: #64748b;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👑 Crownspips Trading</h1>

  <button id="logoutBtn" type="button">
    Logout
  </button>
</header>

<main>

  <div id="loading">
    Loading your account...
  </div>

  <div id="error"></div>

  <div id="dashboard" style="display:none;">

    <h2>
      Welcome, <span id="name">Trader</span>
    </h2>

    <div id="banner" class="banner"></div>

    <div class="info">
      <p><strong>Email:</strong> <span id="email"></span></p>
      <p><strong>Account Type:</strong> <span id="accountType"></span></p>
      <p><strong>Verification:</strong> <span id="verification"></span></p>
    </div>

    <div class="cards">

      <div class="card usd">
        <h4 id="usdLabel">Demo USD Balance</h4>
        <div class="balance" id="usdBalance">$0.00</div>
      </div>

      <div class="card ngn">
        <h4>NGN Balance</h4>
        <div class="balance" id="ngnBalance">₦0.00</div>
      </div>

      <div class="card">
        <h4>USD Deposits</h4>
        <div class="balance" id="usdDeposits">$0.00</div>
      </div>

      <div class="card">
        <h4>NGN Deposits</h4>
        <div class="balance" id="ngnDeposits">₦0.00</div>
      </div>

      <div class="card">
        <h4>Open Trades</h4>
        <div class="balance" id="openTrades">0</div>
      </div>

      <div class="card">
        <h4>Status</h4>
        <div class="balance" id="status">-</div>
      </div>

    </div>

    <div class="buttons">

      <button id="depositBtn" class="deposit" type="button">
        Deposit
      </button>

      <button id="withdrawBtn" class="withdraw" type="button">
        Withdraw
      </button>

      <button id="demoTrade" class="trade" type="button">
        Demo Trade
      </button>

      <button id="verifyBtn"
        class="verify"
        type="button"
        style="display:none;">
        Complete Verification
      </button>

    </div>

    <section>
      <h3>Recent Transactions</h3>
      <div id="transactions">No transactions yet.</div>
    </section>

    <section>
      <h3>Trades</h3>
      <div id="trades">No trades yet.</div>
    </section>

  </div>

</main>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {

  const SUPABASE_URL =
    "https://ghagrruxxqtnochooiaj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FORCt30umzxv7ardnSxokA_8l0-En0B";

  let client = null;
  let user = null;
  let profile = null;

  const logoutBtn =
    document.getElementById("logoutBtn");

  const depositBtn =
    document.getElementById("depositBtn");

  const withdrawBtn =
    document.getElementById("withdrawBtn");

  const demoTradeBtn =
    document.getElementById("demoTrade");

  const verifyBtn =
    document.getElementById("verifyBtn");


  /* =========================
     LOGOUT
     ========================= */

  logoutBtn.addEventListener("click", async function () {

    logoutBtn.disabled = true;
    logoutBtn.textContent = "Logging out...";

    /*
      Clear the Supabase session locally first.
      This makes logout work even if the
      Supabase server is temporarily unavailable.
    */

    try {
      Object.keys(localStorage).forEach(function (key) {

        if (
          key.startsWith("sb-") &&
          key.endsWith("-auth-token")
        ) {
          localStorage.removeItem(key);
        }

      });
    } catch (e) {
      console.log(e);
    }

    try {

      if (client) {
        await client.auth.signOut();
      }

    } catch (e) {
      console.log("Supabase logout:", e);
    }

    window.location.replace("login.html");
  });


  /* =========================
     ERROR
     ========================= */

  function showError(message) {

    document.getElementById("loading")
      .style.display = "none";

    const error =
      document.getElementById("error");

    error.style.display = "block";

    error.innerHTML =
      "<strong>Dashboard error:</strong><br>" +
      message +
      "<br><br>" +
      "<button onclick=\"location.reload()\" " +
      "style=\"padding:10px 16px;border:0;" +
      "border-radius:8px;background:#991b1b;" +
      "color:white;font-weight:bold;\">" +
      "Reload Dashboard" +
      "</button>";
  }


  /* =========================
     FORMAT
     ========================= */

  function usd(value) {

    return "$" +
      Number(value || 0).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }


  function ngn(value) {

    return "₦" +
      Number(value || 0).toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
  }


  /* =========================
     DISABLE REAL FUNCTIONS
     ========================= */

  function disableRealFunctions(message) {

    depositBtn.classList.add("disabled");
    withdrawBtn.classList.add("disabled");

    depositBtn.textContent =
      "Deposit Unavailable";

    withdrawBtn.textContent =
      "Withdraw Unavailable";

    depositBtn.onclick = function () {
      alert(message);
    };

    withdrawBtn.onclick = function () {
      alert(message);
    };
  }


  /* =========================
     ENABLE REAL FUNCTIONS
     ========================= */

  function enableRealFunctions() {

    depositBtn.classList.remove("disabled");
    withdrawBtn.classList.remove("disabled");

    depositBtn.textContent = "Deposit";
    withdrawBtn.textContent = "Withdraw";

    depositBtn.onclick = function () {
      location.href = "deposit.html";
    };

    withdrawBtn.onclick = function () {

      alert(
        "Withdrawal request section is available for your verified real account."
      );

    };
  }


  /* =========================
     LOAD PROFILE
     ========================= */

  async function loadProfile() {

    const result =
      await client
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (result.error) {
      throw result.error;
    }

    if (!result.data) {
      throw new Error(
        "No profile was found for this account."
      );
    }

    profile = result.data;

    const type =
      String(
        profile.account_type || "demo"
      ).toLowerCase();

    const verification =
      String(
        profile.verification_status || "pending"
      ).toLowerCase();


    document.getElementById("name")
      .textContent =
      profile.full_name || "Trader";

    document.getElementById("email")
      .textContent =
      profile.email || user.email || "";

    document.getElementById("accountType")
      .textContent =
      type.toUpperCase();

    document.getElementById("verification")
      .textContent =
      verification.toUpperCase();


    const banner =
      document.getElementById("banner");


    /* VERIFIED REAL */

    if (
      type === "real" &&
      verification === "verified"
    ) {

      banner.className = "banner real";

      banner.innerHTML =
        "<h3>REAL ACCOUNT — ACTIVE</h3>" +
        "<p>Your real account has been verified and is active.</p>";

      document.getElementById("usdLabel")
        .textContent =
        "Real USD Balance";

      document.getElementById("usdBalance")
        .textContent =
        usd(profile.real_balance);

      document.getElementById("ngnBalance")
        .textContent =
        ngn(profile.ngn_balance);

      document.getElementById("status")
        .textContent =
        "ACTIVE";

      demoTradeBtn.style.display = "none";
      verifyBtn.style.display = "none";

      enableRealFunctions();

      return;
    }


    /* PENDING REAL */

    if (
      type === "real" &&
      verification === "pending"
    ) {

      banner.className = "banner pending";

      banner.innerHTML =
        "<h3>REAL ACCOUNT — PENDING</h3>" +
        "<p>Your real account application is awaiting admin verification.</p>";

      document.getElementById("usdLabel")
        .textContent =
        "Real USD Balance";

      document.getElementById("usdBalance")
        .textContent =
        "$0.00";

      document.getElementById("ngnBalance")
        .textContent =
        "₦0.00";

      document.getElementById("status")
        .textContent =
        "PENDING";

      demoTradeBtn.style.display = "none";

      verifyBtn.style.display = "inline-block";

      verifyBtn.textContent =
        "Complete Verification";

      verifyBtn.onclick = function () {
        location.href = "verification.html";
      };

      disableRealFunctions(
        "Your real account is still pending verification."
      );

      return;
    }


    /* REJECTED REAL */

    if (
      type === "real" &&
      verification === "rejected"
    ) {

      banner.className = "banner rejected";

      banner.innerHTML =
        "<h3>REAL ACCOUNT — REJECTED</h3>" +
        "<p>Your real account application was not approved. You can update your verification information and submit it again.</p>";

      document.getElementById("usdLabel")
        .textContent =
        "Real USD Balance";

      document.getElementById("usdBalance")
        .textContent =
        "$0.00";

      document.getElementById("ngnBalance")
        .textContent =
        "₦0.00";

      document.getElementById("status")
        .textContent =
        "REJECTED";

      demoTradeBtn.style.display = "none";

      verifyBtn.style.display = "inline-block";

      verifyBtn.textContent =
        "Update Verification";

      verifyBtn.onclick = function () {
        location.href = "verification.html";
      };

      disableRealFunctions(
        "Your real account is currently rejected."
      );

      return;
    }


    /* DEMO */

    banner.className = "banner demo";

    banner.innerHTML =
      "<h3>DEMO ACCOUNT</h3>" +
      "<p>You are using a simulated trading account. Demo funds are completely separate from real-account funds.</p>";

    document.getElementById("usdLabel")
      .textContent =
      "Demo USD Balance";

    document.getElementById("usdBalance")
      .textContent =
      usd(profile.balance);

    document.getElementById("ngnBalance")
      .textContent =
      "₦0.00";

    document.getElementById("status")
      .textContent =
      "DEMO";

    demoTradeBtn.style.display =
      "inline-block";

    verifyBtn.style.display =
      "none";

    disableRealFunctions(
      "Real deposits and withdrawals are available only on an active verified real account."
    );
  }


  /* =========================
     TRANSACTIONS
     ========================= */

  async function loadTransactions() {

    const result =
      await client
        .from("transactions")
        .select("*")
        .eq("user_id", user.id)
        .order("created_at", {
          ascending: false
        })
        .limit(20);

    if (result.error) {

      document.getElementById("transactions")
        .textContent =
        "Unable to load transactions.";

      return;
    }

    const transactions =
      result.data || [];

    const box =
      document.getElementById("transactions");

    let usdTotal = 0;
    let ngnTotal = 0;

    if (!transactions.length) {

      box.textContent =
        "No transactions yet.";

      return;
    }

    box.innerHTML = "";

    transactions.forEach(function (tx) {

      const currency =
        String(
          tx.currency || "USD"
        ).toUpperCase();

      if (
        tx.transaction_type === "DEPOSIT" &&
        tx.status === "COMPLETED"
      ) {

        if (currency === "NGN") {
          ngnTotal += Number(tx.amount || 0);
        } else {
          usdTotal += Number(tx.amount || 0);
        }
      }

      const div =
        document.createElement("div");

      div.className = "item";

      const symbol =
        currency === "NGN"
          ? "₦"
          : "$";

      div.innerHTML =
        "<strong>" +
        (tx.transaction_type || "") +
        "</strong> " +
        symbol +
        Number(tx.amount || 0).toLocaleString() +
        "<br><small class='muted'>" +
        currency +
        " • " +
        (tx.status || "") +
        "</small>";

      box.appendChild(div);
    });

    document.getElementById("usdDeposits")
      .textContent =
      usd(usdTotal);

    document.getElementById("ngnDeposits")
      .textContent =
      ngn(ngnTotal);
  }


  /* =========================
     TRADES
     ========================= */

  async function loadTrades() {

    const result =
      await client
        .from("trades")
        .select("*")
        .eq("user_id", user.id)
        .order("opened_at", {
          ascending: false
        });

    if (result.error) {

      document.getElementById("trades")
        .textContent =
        "Unable to load trades.";

      return;
    }

    const trades =
      result.data || [];

    const open =
      trades.filter(function (trade) {
        return String(trade.status)
          .toUpperCase() === "OPEN";
      });

    document.getElementById("openTrades")
      .textContent =
      open.length;

    const box =
      document.getElementById("trades");

    if (!trades.length) {

      box.textContent =
        "No trades yet.";

      return;
    }

    box.innerHTML = "";

    trades.slice(0, 20)
      .forEach(function (trade) {

        const div =
          document.createElement("div");

        div.className = "item";

        div.innerHTML =
          "<strong>" +
          trade.pair +
          "</strong> — " +
          trade.trade_type +
          "<br><small class='muted'>" +
          "Units: " +
          trade.units +
          " • Open: " +
          trade.open_price +
          " • " +
          trade.status +
          "</small>";

        box.appendChild(div);
      });
  }


  /* =========================
     DEMO TRADE
     ========================= */

  demoTradeBtn.onclick = async function () {

    if (!profile) return;

    if (
      String(profile.account_type)
        .toLowerCase() !== "demo"
    ) {

      alert(
        "Demo trading is only available on a demo account."
      );

      return;
    }

    const result =
      await client
        .from("trades")
        .insert({
          user_id: user.id,
          pair: "EUR/USD",
          trade_type: "BUY",
          units: 1000,
          open_price: 1.1000,
          status: "OPEN"
        });

    if (result.error) {

      alert(
        "Demo trade failed: " +
        result.error.message
      );

      return;
    }

    alert("Demo trade opened.");

    await loadTrades();
  };


  /* =========================
     START
     ========================= */

  async function start() {

    try {

      /*
        Check that Supabase actually loaded.
      */

      if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
      ) {

        throw new Error(
          "Supabase could not load. Please check your internet connection and reload the page."
        );
      }


      client =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      const result =
        await client.auth.getSession();


      if (result.error) {
        throw result.error;
      }


      if (!result.data.session) {

        window.location.replace(
          "login.html"
        );

        return;
      }


      user =
        result.data.session.user;


      await loadProfile();

      await loadTransactions();

      await loadTrades();


      document.getElementById("loading")
        .style.display = "none";

      document.getElementById("dashboard")
        .style.display = "block";

    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Unable to load your account."
      );
    }
  }


  /*
    Give the browser a moment to finish
    loading the Supabase script.
  */

  window.addEventListener("load", function () {
    start();
  });

})();
</script>

</body>
  </html>
