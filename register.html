<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crownspips Trading - Register</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .register-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px #0002;
    }

    h1 {
      text-align: center;
      color: #111827;
    }

    .gold {
      color: #d4af37;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .login a {
      color: #111827;
      font-weight: bold;
    }

    .demo {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="register-box">

  <h1>Crownspips <span class="gold">Trading</span></h1>

  <form onsubmit="register(event)">

    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Email Address</label>
    <input type="email" id="email" required>

    <label>Password</label>
    <input type="password" id="password" minlength="6" required>

    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" minlength="6" required>

    <button type="submit">Create Demo Account</button>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

  <div class="demo">
    Demo registration only. No real account, deposits,
    investments or withdrawals are created by this page.
  </div>

</div>

<script>
function register(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  alert("Demo account created successfully!");

  window.location.href = "login.html";
}
</script>

</body>
</html>
