<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crownspips Trading - Register</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#111827;
}

.container{
    width:92%;
    max-width:460px;
    margin:45px auto;
}

.box{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 5px 20px #0002;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.gold{
    color:#d4af37;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.login{
    background:white;
    color:#111827;
    border:1px solid #111827;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    line-height:1.5;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.notice{
    margin-top:20px;
    padding:13px;
    background:#fff8df;
    border-left:4px solid #d4af37;
    font-size:13px;
    color:#555;
    line-height:1.5;
}

footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>
Crownspips <span class="gold">Trading</span>
</h1>

<div class="subtitle">
Create Investor Account
</div>

<form id="registerForm">

<label>Full Name</label>

<input
    type="text"
    id="fullName"
    placeholder="Enter your full name"
    required
>

<label>Email Address</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Create a password"
    minlength="6"
    required
>

<label>Confirm Password</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm your password"
    minlength="6"
    required
>

<button
    id="registerButton"
    type="submit"
>
Create Account
</button>

</form>

<div
    id="message"
    class="message"
></div>

<button
    class="login"
    onclick="window.location.href='login.html'"
>
Already have an account? Login
</button>

<div class="notice">

<strong>Demo Environment</strong><br>

This platform is currently under development.
New accounts receive a demo balance only.
Real deposits, withdrawals and investment services are not currently available.

</div>

</div>

<footer>
© 2026 Crownspips Trading
</footer>

</div>


<script>

/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://ghagrruxxqtnochooiaj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FORCt30umzxv7ardnSxokA_8l0-En0B";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    const message =
    document.getElementById("message");

    message.textContent=text;

    message.className=
    "message "+type;

    message.style.display="block";
}


/* =========================
   REGISTRATION
========================= */

document
.getElementById("registerForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const fullName =
    document
    .getElementById("fullName")
    .value
    .trim();

    const email =
    document
    .getElementById("email")
    .value
    .trim();

    const password =
    document
    .getElementById("password")
    .value;

    const confirmPassword =
    document
    .getElementById("confirmPassword")
    .value;

    const button =
    document
    .getElementById("registerButton");


    /* Check password */

    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    /* Minimum password */

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    button.disabled=true;
    button.textContent="Creating Account...";


    /* Create Supabase account */

    const {data,error} =
    await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
            data:{
                full_name:fullName
            }
        }

    });


    if(error){

        showMessage(
            error.message,
            "error"
        );

        button.disabled=false;
        button.textContent="Create Account";

        return;
    }


    /* Get created user */

    const user =
    data.user;


    if(!user){

        showMessage(
            "Account creation was not completed. Please try again.",
            "error"
        );

        button.disabled=false;
        button.textContent="Create Account";

        return;
    }


    /* Create investor profile */

    const {error:profileError} =
    await supabaseClient
    .from("profiles")
    .insert({

        id:user.id,

        full_name:fullName,

        email:email,

        balance:10000

    });


    /*
       If email confirmation is enabled,
       the profile may still be created
       because the authenticated user ID
       is already known.
    */

    if(profileError){

        /*
           Duplicate profile is harmless.
           Other errors are shown.
        */

        if(
            !profileError.message
            .toLowerCase()
            .includes("duplicate")
        ){

            showMessage(
                "Account was created, but the investor profile could not be created: "+
                profileError.message,
                "error"
            );

            button.disabled=false;
            button.textContent="Create Account";

            return;
        }
    }


    showMessage(
        "Account created successfully! You can now log in.",
        "success"
    );


    button.textContent="Account Created";


    setTimeout(function(){

        window.location.href="login.html";

    },1800);

});

</script>

</body>
  </html>
