<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crownspips Trading - Investor Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f8;
    color:#111827;
}

.container{
    width:92%;
    max-width:430px;
    margin:70px auto;
}

.box{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 5px 20px #0002;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.gold{
    color:#d4af37;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:28px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    font-size:14px;
}

input{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:8px;
    background:#111827;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.register-btn{
    display:block;
    width:100%;
    padding:14px;
    margin-top:12px;
    border:1px solid #d4af37;
    border-radius:8px;
    background:white;
    color:#111827;
    font-weight:bold;
    font-size:16px;
    text-align:center;
    text-decoration:none;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.notice{
    margin-top:20px;
    padding:12px;
    background:#fff8df;
    border-left:4px solid #d4af37;
    font-size:13px;
    color:#555;
}

footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>
Crownspips <span class="gold">Trading</span>
</h1>

<div class="subtitle">
Investor Login
</div>

<form id="loginForm">

<label>Email</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button id="loginButton" type="submit">
Investor Login
</button>

</form>

<a href="register.html" class="register-btn">
Register Account
</a>

<div id="message" class="message"></div>

<div class="notice">
<strong>Investor Account</strong><br>
Login to access your Crownspips investor dashboard.
</div>

</div>

<footer>
© 2026 Crownspips Trading
</footer>

</div>

<script>

const SUPABASE_URL =
"https://ghagrruxxqtnochooiaj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FORCt30umzxv7ardnSxokA_8l0-En0B";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function showMessage(text,type){

    const message =
    document.getElementById("message");

    message.textContent=text;

    message.className=
    "message "+type;

    message.style.display="block";
}

document.getElementById("loginForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    const button =
    document.getElementById("loginButton");

    button.disabled=true;
    button.textContent="Logging in...";

    const {data,error} =
    await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
    });

    if(error){

        showMessage(
            error.message,
            "error"
        );

        button.disabled=false;
        button.textContent="Investor Login";

        return;
    }

    showMessage(
        "Login successful. Opening your dashboard...",
        "success"
    );

    setTimeout(function(){

        window.location.href="index.html";

    },800);

});

</script>

</body>
</html>
